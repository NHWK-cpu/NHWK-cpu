<svg xmlns="http://www.w3.org/2000/svg" width="320" height="176" viewBox="0 0 320 176" font-family="JetBrains Mono, JetBrainsMono Nerd Font, JetBrains Mono NL, Segoe UI, sans-serif">
  <style>
    svg, text, tspan { font-family: JetBrains Mono, JetBrainsMono Nerd Font, JetBrains Mono NL, Segoe UI, sans-serif; }
    text { font-size: 14px; }
    .bg { fill: hsl(41, 60%, 97%); stroke: hsl(41, 45%, 78%); stroke-width: 1.5; }
    .title { fill: hsl(41, 75%, 34%); font-size: 16px; font-weight: 700; }
    .desc { fill: hsl(41, 12%, 28%); }
    .lang { fill: hsl(41, 15%, 18%); }
    .meta { fill: hsl(41, 10%, 36%); }
    .sep { stroke: hsl(41, 35%, 85%); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: hsl(41, 28%, 12%); stroke: hsl(41, 40%, 32%); }
      .title { fill: hsl(41, 90%, 72%); }
      .desc { fill: hsl(41, 15%, 80%); }
      .lang { fill: hsl(41, 15%, 88%); }
      .meta { fill: hsl(41, 12%, 68%); }
      .sep { stroke: hsl(41, 25%, 24%); }
    }
  </style>
  <rect class="bg" x="4" y="4" width="312" height="168" rx="12"/>
  <text class="title" x="20" y="36" font-family="JetBrains Mono, JetBrainsMono Nerd Font, JetBrains Mono NL, Segoe UI, sans-serif" font-size="16">KeuanganSekolah</text>
  <text class="desc" x="20" y="64" font-family="JetBrains Mono, JetBrainsMono Nerd Font, JetBrains Mono NL, Segoe UI, sans-serif" font-size="14">Cash flow management and</text>
  <text class="desc" x="20" y="84" font-family="JetBrains Mono, JetBrainsMono Nerd Font, JetBrains Mono NL, Segoe UI, sans-serif" font-size="14">monitoring system for an academy</text>
  <line class="sep" x1="20" y1="124" x2="300" y2="124"/>
  <circle cx="25" cy="145" r="5" fill="#945db7"/>
  <text class="lang" x="38" y="150" font-family="JetBrains Mono, JetBrainsMono Nerd Font, JetBrains Mono NL, Segoe UI, sans-serif" font-size="14">VB.NET</text>
  <text class="meta" x="300" y="150" font-family="JetBrains Mono, JetBrainsMono Nerd Font, JetBrains Mono NL, Segoe UI, sans-serif" font-size="14" text-anchor="end">Commit 5 bln lalu</text>
</svg>